name = "skin-ritual-nudges"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Created with: npx wrangler kv namespace create NUDGES
[[kv_namespaces]]
binding = "NUDGES"
id = "PASTE_YOUR_KV_ID_HERE"

[vars]
ALLOWED_ORIGIN = "https://itechroof.github.io"
TIMEZONE = "Europe/London"
NUDGE_COOLDOWN_DAYS = "3"   # at most one nudge per person every 3 days
QUIET_START = "21"          # no nudges from 21:00 ...
QUIET_END = "8"             # ... until 08:00

# Secrets (set with npx wrangler secret put NAME):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, USERS
