<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skin Ritual</title>
  <meta name="description" content="Guided skincare routines, progress heatmap and photos.">
  <meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151D20" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Skin Ritual">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c0 0-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      <span>Progress</span>
    </button>
    <button class="tab" data-tab="photos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Photos</span>
    </button>
    <button class="tab" data-tab="ask">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-4 4v-4H5z"/></svg>
      <span>Ask</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="runner" class="runner" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
